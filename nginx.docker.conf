worker_processes auto;

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log off;
    error_log  /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        font/ttf
        font/otf
        image/svg+xml;

    server {
        listen       8080;
        server_name  localhost;

        root  /usr/share/nginx/html;
        index index.html;

        # Backend proxy blocks — resolved via Docker internal DNS
        location /auth/ {
            resolver 127.0.0.11 valid=30s;
            proxy_pass http://backend:8080/auth/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Origin            "";
        }

        location /api/users/ {
            resolver 127.0.0.11 valid=30s;
            proxy_pass http://backend:8080/api/users/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Origin            "";
        }

        # SSE endpoint — must be before generic /api/ block, needs buffering disabled
        location /api/alerts/stream {
            resolver 127.0.0.11 valid=30s;
            proxy_pass http://backend:8080/api/alerts/stream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Origin            "";
            proxy_set_header Connection        '';
            proxy_http_version                 1.1;
            proxy_buffering                    off;
            proxy_cache                        off;
            proxy_read_timeout                 86400s;
            chunked_transfer_encoding          on;
        }

        location /api/ {
            resolver 127.0.0.11 valid=30s;
            proxy_pass http://backend:8080/api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Origin            "";
        }

        location = /heartbeat {
            resolver 127.0.0.11 valid=30s;
            proxy_pass http://backend:8080/heartbeat;
            proxy_connect_timeout 3s;
            proxy_send_timeout    3s;
            proxy_read_timeout    3s;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Origin            "";
        }

        # Static asset caching — safe because Angular hashes filenames on build
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Angular client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
