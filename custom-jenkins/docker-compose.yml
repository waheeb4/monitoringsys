services:
  jenkins:
    build:
      context: .
    container_name: monitoring-jenkins
    user: "0:0"
    ports:
      - "8088:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # The CI checkout must be visible at the identical absolute path to
      # both Jenkins and the host Docker daemon so Compose file secrets work.
      # Start this Compose file from the repository root.
      - ${PWD}:${PWD}

volumes:
  jenkins_home:
